<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - OmniLink</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 2.5em; margin-bottom: 0.5em; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    p { font-size: 1.1em; margin-bottom: 2em; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    button {
      background: white;
      color: #667eea;
      border: none;
      padding: 15px 30px;
      font-size: 1em;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: scale(1.05); }
    button:active { transform: scale(0.95); }
    button:focus { outline: 3px solid rgba(255,255,255,0.5); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="container" role="alert" aria-live="polite">
    <h1>📡 You're Offline</h1>
    <p>OmniLink requires an internet connection. Please check your network and try again.</p>
    <button id="retry-btn" type="button" aria-label="Retry loading the page">Try Again</button>
  </main>
  <script>
    document.getElementById('retry-btn').addEventListener('click', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
