<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="APEX OmniHub - The universal translator + orchestrator that connects AI, enterprise systems, and Web3 through a single controlled port."
    />
    <meta name="theme-color" content="#0f1729" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- Font: preload + display=optional eliminates font-swap CLS site-wide.
         display=optional: use font if cached/fast; no later swap = no layout shift. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=optional"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=optional"
      rel="stylesheet"
    />
    <title>APEX OmniHub - Intelligence, Designed.</title>

    <!-- FOUC Prevention: Set theme before render -->
    <script>
      (function () {
        var theme = localStorage.getItem("theme");
        if (!theme) theme = "light";
        document.documentElement.dataset.theme = theme;
      })();
      // Capture PWA install prompt if it fires before React mounts
      window.__deferredPWAEvent = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPWAEvent = e;
      });
    </script>

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="APEX OmniHub | Intelligence, Designed."
    />
    <meta
      property="og:description"
      content="The universal translator + orchestrator that connects AI, enterprise systems, and Web3 through a single controlled port."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://apexomnihub.icu/" />
    <meta property="og:image" content="https://apexomnihub.icu/og.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="APEX OmniHub | Intelligence, Designed."
    />
    <meta
      name="twitter:description"
      content="The universal translator + orchestrator connecting AI, enterprise, and Web3."
    />
    <meta name="twitter:image" content="https://apexomnihub.icu/og.png" />
  </head>

  <body>
    <div id="root"></div>
    <div id="omni-portal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
