<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APEX OmniHub</title>
  <meta name="description" content="APEX OmniHub: The Enterprise Intelligence Platform. Orchestrate AI agents, secure workflows, and manage business automation from a central control plane." />

  <!-- FOUC Prevention: Set theme before render -->
  <script>
    (function () {
      var theme = localStorage.getItem('theme');
      if (!theme) theme = 'light';
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- Open Graph -->
  <meta property="og:title" content="APEX OmniHub | Intelligence, Designed." />
  <meta property="og:description"
    content="The universal translator + orchestrator that connects AI, enterprise systems, and Web3 through a single controlled port." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://apexomnihub.icu/" />
  <meta property="og:image" content="https://apexomnihub.icu/og.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="APEX OmniHub | Intelligence, Designed." />
  <meta name="twitter:description"
    content="The universal translator + orchestrator connecting AI, enterprise, and Web3." />
  <meta name="twitter:image" content="https://apexomnihub.icu/og.png" />
</head>

</html>
