<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">APEX Core Badge</title>
  <desc id="desc">Glowing APEX Core badge for hero orb center.</desc>
  <defs>
    <radialGradient id="coreBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e6f7ff" stop-opacity="0.95"/>
      <stop offset="52%" stop-color="#9ad8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#55b9ff" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c06a"/>
      <stop offset="100%" stop-color="#e8a247"/>
    </linearGradient>
    <filter id="badgeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#badgeGlow)">
    <rect x="28" y="34" width="200" height="188" rx="30" fill="url(#coreBg)"/>
    <rect x="28" y="34" width="200" height="188" rx="30" fill="none" stroke="url(#stroke)" stroke-width="8"/>
    <path d="M58 184l42-76h22l43 76h-25l-7-13H89l-7 13H58zm40-32h27l-13-25-14 25z" fill="#0b2d4a"/>
    <text x="128" y="95" text-anchor="middle" fill="#0b2d4a" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="3">APEX</text>
    <text x="128" y="204" text-anchor="middle" fill="#0b2d4a" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="4">CORE</text>
  </g>
</svg>
