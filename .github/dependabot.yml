# Dependabot configuration — automated dependency updates with security priority.
# PRs are grouped to reduce noise. Security updates bypass grouping.

version: 2

updates:
  # ── npm / bun (frontend + root) ─────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Edmonton"
    open-pull-requests-limit: 5
    groups:
      radix-ui:
        patterns: ["@radix-ui/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "playwright", "@playwright/*"]
        update-types: ["minor", "patch"]
    ignore:
      # Lock major versions — upgrade intentionally
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "automated"]
    reviewers: ["apexbusiness-systems"]

  # ── pip (orchestrator Python) ─────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/orchestrator"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Edmonton"
    open-pull-requests-limit: 3
    labels: ["dependencies", "automated", "python"]
    reviewers: ["apexbusiness-systems"]

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "automated", "ci"]
