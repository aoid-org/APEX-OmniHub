name: "A.R.I.S.E. Structural Observatory (Phase 0)"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: arise-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-observatory:
    name: "A.R.I.S.E. Structural Observatory"
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install A.R.I.S.E. dependencies
        run: cd apps/apex-arise && bun install
        continue-on-error: true

      - name: Run structural quality scan
        run: cd apps/apex-arise && bun run arise:scan
        continue-on-error: true
