name: RSI Governance Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rsi-governance-gate:
    name: RSI Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run RSI evidence and policy gate
        run: python3 tools/rsi/build_evidence.py --ci && python3 tools/rsi/policy_engine.py && python3 tools/rsi/decision.py
