name: RSI Governance Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsi-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rsi-governance-gate:
    name: RSI Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install RSI dependencies
        run: pip install --only-binary :all: -r tools/rsi/requirements.txt

      - name: Execute RSI governance gate
        run: |
          python3 tools/rsi/build_evidence.py --ci && \
          python3 tools/rsi/policy_engine.py && \
          python3 tools/rsi/decision.py
