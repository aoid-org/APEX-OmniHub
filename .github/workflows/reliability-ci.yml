name: Reliability CI

on:
  push:
    branches:
      - "codex/**"
    paths:
      - "orchestrator/reliability/**"
      - "orchestrator/tests/test_cache_hydration_reliability.py"
      - "orchestrator/tests/test_llm_metrics_module.py"
      - "orchestrator/tests/test_llm_plan_resilience_module.py"
      - ".github/workflows/reliability-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "orchestrator/reliability/**"
      - "orchestrator/tests/test_cache_hydration_reliability.py"
      - "orchestrator/tests/test_llm_metrics_module.py"
      - "orchestrator/tests/test_llm_plan_resilience_module.py"
      - ".github/workflows/reliability-ci.yml"

jobs:
  reliability-tests:
    name: Reliability Tests + Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "orchestrator/pyproject.toml"

      - name: Install dependencies
        working-directory: orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run reliability test suite with strict coverage
        working-directory: orchestrator
        run: |
          pytest \
            tests/test_cache_hydration_reliability.py \
            tests/test_llm_metrics_module.py \
            tests/test_llm_plan_resilience_module.py \
            --cov=reliability \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Upload reliability coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./orchestrator/coverage.xml
          flags: reliability
          name: reliability-coverage
