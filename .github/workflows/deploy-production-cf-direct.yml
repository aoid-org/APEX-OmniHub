# APEX OmniHub — Production Direct Deploy
#
# PURPOSE: Builds the frontend with secrets from GitHub (not CF Pages dashboard)
#          and deploys pre-built artifacts via wrangler direct upload.
#          This deployment ALWAYS wins over the CF Pages auto-build because it
#          runs after it and becomes the latest deployment.
#
# WHY THIS EXISTS: CF Pages auto-build uses dashboard env vars which can drift.
#                  This workflow bakes VITE_SUPABASE_* from GitHub Secrets —
#                  the single source of truth — and uploads the result directly.
#
# REQUIRED GITHUB REPOSITORY VARIABLES (Settings → Variables → Actions):
#   CF_PAGES_PROJECT_NAME  — your Cloudflare Pages project name (e.g. "omnihub")
#
# REQUIRED GITHUB REPOSITORY SECRETS (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN      — scoped to Pages:Edit + Account:Read
#   CLOUDFLARE_ACCOUNT_ID     — CF Account ID
#   VITE_SUPABASE_URL         — https://rtopreovkywofgwgmozi.supabase.co
#   VITE_SUPABASE_ANON_KEY    — anon JWT for rtopreovkywofgwgmozi
#   VITE_SUPABASE_PUBLISHABLE_KEY — same anon JWT (browser-safe)

name: Deploy → CF Pages Production (Direct)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild even if no source changes"
        type: boolean
        default: false

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false  # Never cancel an in-flight production deploy

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  build-and-deploy:
    name: Build & Deploy (Direct Upload)
    runs-on: ubuntu-latest
    # Guard: skip if secrets not configured (avoids broken deploys on forks)
    if: >
      vars.CF_PAGES_PROJECT_NAME != '' &&
      secrets.CLOUDFLARE_API_TOKEN != '' &&
      secrets.VITE_SUPABASE_URL != ''

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Preflight — validate env vars
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-env-root.mjs

      - name: Build (with correct secrets)
        env:
          VITE_SITE_URL: https://apexomnihub.icu
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Bypass the prebuild guard's re-run (already ran above)
          APEX_ALLOW_MISSING_SUPABASE_CONFIG: "false"
          NODE_ENV: production
        run: |
          echo "Building with SUPABASE_URL=$(echo $VITE_SUPABASE_URL | cut -c1-40)..."
          bun run build
          echo "Build complete. Artifact size: $(du -sh dist | cut -f1)"

      - name: Deploy to Cloudflare Pages (direct upload)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT_NAME }}
        run: |
          echo "Deploying to CF Pages project: ${CF_PAGES_PROJECT}"
          npx --yes --ignore-scripts wrangler@latest pages deploy dist \
            --project-name="${CF_PAGES_PROJECT}" \
            --branch="main" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-dirty=false \
            2>&1 | tee /tmp/deploy.log

          DEPLOY_URL=$(grep -oP 'https://[^\s]+\.pages\.dev' /tmp/deploy.log | head -1 || echo "")
          echo "Deployed to: ${DEPLOY_URL:-apexomnihub.icu}"

          # Fail loud if wrangler errored
          if grep -qi "error\|failed\|fatal" /tmp/deploy.log; then
            echo "::warning::Possible error in wrangler output — review log above"
          fi

      - name: Smoke test — login page responds
        run: |
          sleep 15  # allow CF propagation
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://apexomnihub.icu/login || echo "000")
          echo "Login page HTTP status: ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "::error::Login page returned ${STATUS}. Investigate deployment."
            exit 1
          fi
          echo "✅ Login page is live."
