name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  PRODUCTION_SITE_URL: https://apexomnihub.icu

jobs:
  pr_validation:
    name: PR Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Validate workflow syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/release.yml'))"

      - name: Deterministic Validator CI Gate (Sim Mode)
        run: node integration-harness/lib/deterministic-validator.mjs
        env:
          SIM_MODE: "true"
          TARGET_URL: "http://localhost:8001"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Fmt & Plan
        run: |
          if [ -d "terraform/environments/production" ]; then
            cd terraform/environments/production
            terraform init -backend=false
            terraform fmt -check
            if [ -n "${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}" ]; then
               terraform plan -var="target_slot=production-shadow"
            else
               echo "Skipping terraform plan due to missing secrets."
            fi
          fi

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1
        with:
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages [skip ci]"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Shadow-Stage (production-shadow)
        if: steps.changesets.outputs.published == 'true' && vars.ENABLE_SHADOW_DEPLOYMENT == 'true'
        run: |
          echo "Deploying frontend to shadow slot..."
          npm run build -- --outDir dist/shadow
          # Shadow-slot backend smoke target.
          echo "Deploying Python orchestrator to shadow slot..."
          cd orchestrator && pkill -f shadow || true && python -m uvicorn main:app --host 0.0.0.0 --port 8001 &
        env:
          VITE_SITE_URL: ${{ env.PRODUCTION_SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deterministic Validator CI Gate
        if: steps.changesets.outputs.published == 'true' && vars.ENABLE_SHADOW_DEPLOYMENT == 'true'
        run: node integration-harness/lib/deterministic-validator.mjs
        env:
          TARGET_URL: http://localhost:8001

      - name: Skip shadow deployment until slot config is explicitly enabled
        if: steps.changesets.outputs.published == 'true' && vars.ENABLE_SHADOW_DEPLOYMENT != 'true'
        run: |
          echo "Skipping shadow deployment and routing flip."
          echo "Set repository variable ENABLE_SHADOW_DEPLOYMENT=true only after the Cloudflare Pages shadow slot is provisioned and verified."

      - name: Atomic Routing Flip (Promote to Active)
        if: steps.changesets.outputs.published == 'true' && vars.ENABLE_SHADOW_DEPLOYMENT == 'true' && vars.ENABLE_ATOMIC_ROUTING_FLIP == 'true'
        run: |
          cd terraform/environments/production
          terraform init
          terraform apply -auto-approve -var="target_slot=production-shadow"

      - name: Skip atomic routing flip until explicitly enabled
        if: steps.changesets.outputs.published == 'true' && vars.ENABLE_SHADOW_DEPLOYMENT == 'true' && vars.ENABLE_ATOMIC_ROUTING_FLIP != 'true'
        run: |
          echo "Shadow deployment completed."
          echo "Skipping routing flip because ENABLE_ATOMIC_ROUTING_FLIP is not true."
