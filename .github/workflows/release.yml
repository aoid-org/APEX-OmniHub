name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  PRODUCTION_SITE_URL: https://apexomnihub.icu

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1
        with:
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages [skip ci]"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend artifact
        if: steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main'
        run: npm run build
        env:
          VITE_SITE_URL: ${{ env.PRODUCTION_SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Check real shadow deployment prerequisites
        if: steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main'
        id: shadow_check
        run: |
          if [[ -z "${{ secrets.VITE_SHADOW_DEPLOY_URL }}" ]] || [[ -z "${{ secrets.SHADOW_DEPLOY_API_KEY }}" ]]; then
            echo "blocker=true" >> $GITHUB_OUTPUT
            echo "SHADOW_DEPLOYMENT_BLOCKED: Real shadow deployment URL or API key not configured"
            exit 0
          fi
          echo "blocker=false" >> $GITHUB_OUTPUT

      - name: Log shadow deployment blocker
        if: steps.changesets.outputs.published == 'true' && steps.shadow_check.outputs.blocker == 'true' && github.ref == 'refs/heads/main'
        run: |
          cat > release-evidence.json << 'EOF'
          {
            "workflow": "release",
            "branch": "main",
            "commit": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "NOT_CERTIFIED_BLOCKED",
            "blocker": "SHADOW_DEPLOYMENT_NOT_CONFIGURED",
            "message": "Real shadow deployment target (VITE_SHADOW_DEPLOY_URL, SHADOW_DEPLOY_API_KEY) not configured in GitHub secrets. Cannot proceed with production deployment."
          }
          EOF
          echo "::notice::Shadow deployment prerequisites not met. Skipping atomic routing flip."

      - name: Health check real shadow deployment
        if: steps.changesets.outputs.published == 'true' && steps.shadow_check.outputs.blocker == 'false' && github.ref == 'refs/heads/main'
        run: |
          SHADOW_URL="${{ secrets.VITE_SHADOW_DEPLOY_URL }}"
          echo "Checking health of shadow deployment: $SHADOW_URL/health"
          if curl -s -f "$SHADOW_URL/health" > /dev/null 2>&1; then
            echo "✓ Shadow deployment is healthy"
          else
            echo "✗ Shadow deployment health check failed"
            exit 1
          fi

      - name: Run deterministic validator against shadow
        if: steps.changesets.outputs.published == 'true' && steps.shadow_check.outputs.blocker == 'false' && github.ref == 'refs/heads/main'
        run: node integration-harness/lib/deterministic-validator.mjs
        env:
          TARGET_URL: ${{ secrets.VITE_SHADOW_DEPLOY_URL }}

      - name: Terraform format check
        if: steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main'
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform plan (production-shadow slot)
        if: steps.changesets.outputs.published == 'true' && steps.shadow_check.outputs.blocker == 'false' && github.ref == 'refs/heads/main'
        id: terraform_plan
        run: |
          cd terraform/environments/production
          terraform init
          terraform plan -var="target_slot=production-shadow" -out=tfplan > plan.txt
          cat plan.txt

      - name: Upload terraform plan artifact
        if: steps.changesets.outputs.published == 'true' && steps.shadow_check.outputs.blocker == 'false' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b4de1fb015f0390 # v4
        with:
          name: terraform-plan
          path: terraform/environments/production/tfplan
          retention-days: 1

      - name: Create release evidence
        if: steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main'
        run: |
          cat > release-evidence.json << 'EOF'
          {
            "workflow": "release",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "published": true,
            "shadow_blocker": ${{ steps.shadow_check.outputs.blocker || 'null' }},
            "build_status": "success",
            "terraform_plan_artifact": "terraform-plan",
            "status": "${{ steps.shadow_check.outputs.blocker == 'true' && 'NOT_CERTIFIED_BLOCKED' || 'PENDING_APPROVAL' }}"
          }
          EOF
          cat release-evidence.json

      - name: Upload release evidence
        if: steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b4de1fb015f0390 # v4
        with:
          name: release-evidence
          path: release-evidence.json
          retention-days: 30
