name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create Release PR or Publish
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1
        with:
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages [skip ci]"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Shadow-Stage (production-shadow)
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Deploying frontend to shadow slot..."
          npm run build -- --outDir dist/shadow
          # Mock deploy to shadow environment
          echo "Deploying Python orchestrator to shadow slot..."
          cd orchestrator && pkill -f shadow || true && python -m uvicorn main:app --host 0.0.0.0 --port 8001 &
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deterministic Validator CI Gate
        if: steps.changesets.outputs.published == 'true'
        run: node integration-harness/lib/deterministic-validator.mjs
        env:
          TARGET_URL: http://localhost:8001 # Production-shadow URL

      - name: Atomic Routing Flip (Promote to Active)
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Executing atomic DNS/LB flip..."
          cd terraform/environments/production
          terraform init
          terraform apply -auto-approve -var="target_slot=production-shadow"
