name: Production Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: production-release-gate-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify Release (Fail Closed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify CI integrity
        run: bun run verify:ci-integrity

      - name: Verify release gates
        run: bun run verify:release
