name: Production Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: production-release-gate-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify Release (Fail Closed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify CI integrity
        run: bun run verify:ci-integrity

      - name: Verify release gates
        run: bun run verify:release
