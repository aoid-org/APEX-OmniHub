name: integration-harness
on:
  push:
    branches: [main, work, develop]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Checkout SBBL-HQ sibling repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::warning::GH_PAT secret is empty — cloning sbbl-hq unauthenticated; authenticated harness paths may fail."
          fi
          # Clone into sibling path expected by run.sh preflight.
          git clone "https://x-access-token:${GH_PAT}@github.com/apexbusiness-systems/sbbl-hq.git" ../sbbl-hq

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install OmniHub deps
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install SBBL-HQ deps
        run: cd ../sbbl-hq && npm ci --ignore-scripts

      - name: Install harness deps
        run: cd integration-harness && npm ci --ignore-scripts

      - name: Install Playwright browser
        run: cd integration-harness && npm exec --no --ignore-scripts -- playwright install chromium

      - name: Run harness
        run: cd integration-harness && bash run.sh
        env:
          OMNIHUB_REPO: ${{ github.workspace }}
          SBBL_REPO: ${{ github.workspace }}/../sbbl-hq
          GH_PAT: ${{ secrets.GH_PAT }}
          SBBL_SUPABASE_URL: ${{ secrets.SBBL_SUPABASE_URL }}
          SBBL_SUPABASE_ANON_KEY: ${{ secrets.SBBL_SUPABASE_ANON_KEY }}
          SBBL_SUPABASE_SERVICE_KEY: ${{ secrets.SBBL_SUPABASE_SERVICE_KEY }}
          OMNIHUB_SUPABASE_URL: ${{ secrets.OMNIHUB_SUPABASE_URL }}
          OMNIHUB_SUPABASE_ANON_KEY: ${{ secrets.OMNIHUB_SUPABASE_ANON_KEY }}
          INTEGRATION_ADMIN_EMAIL: ${{ secrets.INTEGRATION_ADMIN_EMAIL }}
          INTEGRATION_ADMIN_PASSWORD: ${{ secrets.INTEGRATION_ADMIN_PASSWORD }}
          INTEGRATION_FAN_EMAIL: ${{ secrets.INTEGRATION_FAN_EMAIL }}
          INTEGRATION_FAN_PASSWORD: ${{ secrets.INTEGRATION_FAN_PASSWORD }}
          INTEGRATION_PPV_ACCESS_CODE: ${{ secrets.INTEGRATION_PPV_ACCESS_CODE }}
          INTEGRATION_PPV_GAME_ID: ${{ secrets.INTEGRATION_PPV_GAME_ID }}
