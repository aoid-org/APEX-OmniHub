name: Security Guards

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Block DEV BYPASS
        run: grep -r "DEV BYPASS" apps/omnihub-site/ && exit 1 || exit 0
