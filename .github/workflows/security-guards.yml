name: Security Guards

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Block DEV BYPASS
        run: grep -r "DEV BYPASS" apps/omnihub-site/ && exit 1 || exit 0
