name: Security Guards

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guardrails:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Block DEV BYPASS
        run: grep -r "DEV BYPASS" apps/omnihub-site/ && exit 1 || exit 0
