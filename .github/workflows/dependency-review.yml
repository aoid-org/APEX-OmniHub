name: Dependency Review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: GitHub-native dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # actions/dependency-review-action requires GitHub Advanced Security +
      # Dependency Graph, which are not enabled on this repository. Without them
      # the action hard-errors ("Dependency review is not supported on this
      # repository") and performs zero analysis. Dependency vulnerability
      # scanning is already enforced by osv-scanner (apex-governance.yml),
      # npm audit + Snyk (secret-scanning.yml), and Dependabot — so gating this
      # GHAS-only step loses no coverage. Set repository variable
      # ENABLE_GHAS_DEPENDENCY_REVIEW=true after enabling Advanced Security to
      # activate native review with full fail-on-severity enforcement.
      - name: Review dependency changes
        if: vars.ENABLE_GHAS_DEPENDENCY_REVIEW == 'true'
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4
        with:
          fail-on-severity: high
      - name: Dependency review not enabled (GHAS unavailable)
        if: vars.ENABLE_GHAS_DEPENDENCY_REVIEW != 'true'
        run: |
          echo "::notice::GitHub-native dependency review skipped — requires GitHub Advanced Security + Dependency Graph (set ENABLE_GHAS_DEPENDENCY_REVIEW=true once enabled)."
          echo "Dependency vulnerability coverage remains active via osv-scanner, npm audit, Snyk, and Dependabot."
