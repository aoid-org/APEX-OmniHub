# Guard Rail Violation Alerting
# Triggers on CI failure when GUARD_RAIL_VIOLATION is detected.
# Opens a GitHub Issue and (optionally) posts to Slack.

name: Guard Rail Violation Alert

on:
  workflow_run:
    workflows: ["CI Runtime Gates"]
    types: [completed]

jobs:
  alert:
    runs-on: ubuntu-22.04
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Download workflow logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: logs/
        continue-on-error: true

      - name: Check for guard rail violations
        id: check
        run: |
          if grep -rqE "GUARD_RAIL_VIOLATION|policy breach|tri-force violation" logs/ 2>/dev/null; then
            echo "violation_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "violation_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open GitHub Issue
        if: steps.check.outputs.violation_detected == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[GUARD RAIL] Violation detected in run ${run.id}`,
              body: [
                '## Guard Rail Violation Detected',
                '',
                `**Workflow:** ${run.name}`,
                `**Branch:** ${run.head_branch}`,
                `**Commit:** ${run.head_sha}`,
                `**Run:** ${run.html_url}`,
                '',
                'Review the workflow logs for details.',
              ].join('\n'),
              labels: ['guard-rail-violation', 'security'],
            });

      - name: Notify Slack
        if: steps.check.outputs.violation_detected == 'true' && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          channel-id: platform-alerts
          slack-message: |
            :rotating_light: *Guard Rail Violation* detected in `${{ github.event.workflow_run.head_branch }}`
            Run: ${{ github.event.workflow_run.html_url }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
