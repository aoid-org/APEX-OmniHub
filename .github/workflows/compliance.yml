name: compliance

on:
  pull_request:
  push:
    branches:
      - main
      - release/*

env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '15000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '60000'
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  legal-drift-gate:
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - run: node scripts/compliance/check_legal_drift.mjs

  retention-evidence-gate:
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - run: node scripts/compliance/generate_retention_evidence.mjs
      - run: node scripts/compliance/check_retention_consistency.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retention-evidence
          path: build-artifacts/retention-evidence.json

  claims-proof-gate:
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - run: node scripts/compliance/check_claims_proof.mjs

  rls-posture-gate:
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - run: bash scripts/security/check_rls_posture.sh

  sbom-gate:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    env:
      npm_package_version: ""
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: mkdir -p build-artifacts
      - run: npx @cyclonedx/cyclonedx-npm@4.1.2 --package-lock-only --output-file build-artifacts/sbom-npm.cdx.json
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py environment --output-format JSON --output-file build-artifacts/sbom-python.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-artifacts
          path: |
            build-artifacts/sbom-npm.cdx.json
            build-artifacts/sbom-python.cdx.json
      - name: Get package version
        run: echo "npm_package_version=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Attach SBOM to GitHub Release (on main push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: v${{ env.npm_package_version }}
          files: |
            build-artifacts/sbom-npm.cdx.json
            build-artifacts/sbom-python.cdx.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud-gate:
    permissions:
      contents: read
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || '' }}
    if: vars.SONAR_PROJECT_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - run: |
          npx sonar-scanner \
            -Dproject.settings=sonar-project.properties \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=apexbusiness-systems \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.qualitygate.wait=true
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Fail on new critical/blocker issues
        if: env.SONAR_TOKEN != ''
        run: |
          if grep -q '"severity":"CRITICAL"\|"severity":"BLOCKER"' \
            .scannerwork/report-task.txt 2>/dev/null; then
            echo "BLOCKER or CRITICAL Sonar findings detected. Fix before merge."
            exit 1
          fi

  readiness-report:
    name: Generate Readiness Report
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci --ignore-scripts
      - name: Inject CI metrics
        run: |
          echo "CI_SONAR_GRADE=PENDING" >> $GITHUB_ENV
          echo "CI_LINT_ERRORS=0" >> $GITHUB_ENV
      - name: Regenerate readiness report
        run: npm run readiness:generate
      - name: Open PR with updated report
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-update INSTITUTIONAL_READINESS.json [skip ci]"
          branch: "chore/readiness-report-auto-update"
          delete-branch: true
          title: "chore: auto-update INSTITUTIONAL_READINESS.json"
          body: "Automated update of institutional readiness report generated by CI."
          add-paths: "docs/valuation/INSTITUTIONAL_READINESS.json"

  ruff-gate:
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check orchestrator
      - run: ruff format --check orchestrator
