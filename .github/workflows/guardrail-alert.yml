# Guardrail Alert Workflow
# Triggered when CI Runtime Gates detects a GUARD_RAIL_VIOLATION.
# Actions: Slack notification + GitHub Issue creation.

name: Guardrail Alert

on:
  workflow_run:
    workflows: ["CI Runtime Gates"]
    types:
      - completed

jobs:
  alert:
    name: Send Guardrail Alert
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Guardrail Violation
        id: check
        run: |
          # Download logs from the triggering workflow
          echo "Checking workflow run ${{ github.event.workflow_run.id }} for guardrail violations..."
          # If the CI workflow failed due to guardrail, the VIOLATION env was set
          # We detect this via the workflow run conclusion + naming convention
          echo "violation=true" >> $GITHUB_OUTPUT

      - name: Notify Slack (#platform-alerts)
        if: steps.check.outputs.violation == 'true'
        uses: slackapi/slack-github-action@3982e204d2ae590e908dd1e279e63933da566c8c # v1.27.0
        with:
          channel-id: "platform-alerts"
          payload: |
            {
              "text": "🚨 GUARDRAIL VIOLATION DETECTED",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Guardrail Violation Alert"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.event.workflow_run.head_branch }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.event.workflow_run.head_sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Actor:*\n${{ github.event.workflow_run.actor.login }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.event.workflow_run.html_url }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Create GitHub Issue
        if: steps.check.outputs.violation == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Guardrail Violation — ${context.payload.workflow_run.head_branch}`;
            const body = [
              '## Guardrail Violation Detected',
              '',
              '| Field | Value |',
              '|-------|-------|',
              `| **Branch** | \`${context.payload.workflow_run.head_branch}\` |`,
              `| **Commit** | \`${context.payload.workflow_run.head_sha}\` |`,
              `| **Actor** | @${context.payload.workflow_run.actor.login} |`,
              `| **Run** | [View](${context.payload.workflow_run.html_url}) |`,
              '',
              '### Action Required',
              '1. Investigate the CI logs for `GUARD_RAIL_VIOLATION` or `policy.*breach`',
              '2. Fix the violation before merging',
              '3. Close this issue once resolved',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['guard-rail-violation', 'security', 'priority:high'],
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
