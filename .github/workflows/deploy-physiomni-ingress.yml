name: Deploy PhysiOmni Ingress

# Production edge functions deploy only from CI on main (ops doc section 5).
# This job is scoped to one function: it never applies migrations and never
# touches any other function.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/physiomni-ingress/**'
      - 'supabase/functions/_shared/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-physiomni-ingress
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy physiomni-ingress
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1
        with:
          version: latest

      - name: Deploy physiomni-ingress
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret ${name} is not set"
              exit 1
            fi
          done
          supabase functions deploy physiomni-ingress --project-ref "$SUPABASE_PROJECT_REF"
