name: Deploy OmniHub Proof Site

on:
  push:
    branches: [main]
    paths:
      - 'apps/omnihub-proof/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Cloudflare Pages
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/omnihub-proof/package-lock.json

      - name: Install dependencies
        working-directory: apps/omnihub-proof
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: apps/omnihub-proof
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=omnihub-proof
          workingDirectory: apps/omnihub-proof
