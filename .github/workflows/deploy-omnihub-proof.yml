name: Deploy OmniHub Proof Site

on:
  push:
    branches: [main]
    paths:
      - 'apps/omnihub-proof/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Cloudflare Pages
    steps:
      # Pin actions to immutable SHAs so CI secrets are not exposed by mutable tags.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/omnihub-proof/package-lock.json

      - name: Install dependencies
        working-directory: apps/omnihub-proof
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: apps/omnihub-proof
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=omnihub-proof
          workingDirectory: apps/omnihub-proof
