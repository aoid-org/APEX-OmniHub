name: Deploy OmniHub Proof Site

on:
  push:
    branches: [main]
    paths:
      - 'apps/omnihub-proof/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Cloudflare Pages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/omnihub-proof/package-lock.json

      - name: Install dependencies
        working-directory: apps/omnihub-proof
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: apps/omnihub-proof
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ea778f5821cc0ad2175de2ded3f2d3a9ab4c1226 # v3.14.1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=omnihub-proof
          workingDirectory: apps/omnihub-proof
