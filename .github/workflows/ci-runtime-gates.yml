name: CI Runtime Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # ARCHITECTURAL BOUNDARY ENFORCEMENT — v1.3.0-RC
  # Fail-closed gate: grep-only, < 2 s, blocks all downstream jobs.
  # ═══════════════════════════════════════════════════════════════════
  architectural-boundary-enforcement:
    name: Architectural Boundary Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Guardrail 0 — File Existence (Rename-Drift Closure) ──────
      - name: "Guardrail 0 - File Existence (Rename-Drift Closure)"
        run: |
          MONITORED_FILES=(
            "orchestrator/main.py"
            "services/orchestrator/api/routes.py"
            "orchestrator/metrics.py"
          )
          MISSING=0
          for f in "${MONITORED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "🛑 BOUNDARY VIOLATION: Monitored file '$f' is missing."
              echo "   RULE: All boundary-monitored files must exist at their canonical paths. File renames silently bypass path-specific guardrails."
              echo "   FIX:  Restore '$f' to its canonical path, or update .github/workflows/ci-runtime-gates.yml to track the new location."
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi
          echo "✅ BOUNDARY CLEAR: All 3 monitored files exist at canonical paths."

      # ── Guardrail 1 — Worker Purity (B1: main.py) ───────────────
      - name: "Guardrail 1 - Worker Purity (main.py must not import HTTP servers)"
        run: |
          if grep -qE "^\s*(import|from)\s+(fastapi|uvicorn)\b" orchestrator/main.py; then
            echo "🛑 BOUNDARY VIOLATION: orchestrator/main.py contains an HTTP server import (fastapi or uvicorn)."
            echo "   RULE: main.py is a pure Temporal Worker CLI entrypoint — no HTTP server imports permitted."
            echo "   FIX:  Remove all fastapi/uvicorn imports from main.py. Move HTTP logic to services/orchestrator/api/."
            exit 1
          else
            echo "✅ BOUNDARY CLEAR: main.py worker purity confirmed — no fastapi/uvicorn imports."
          fi

      # ── Guardrail 2 — API Purity (B2: routes.py) ────────────────
      - name: "Guardrail 2 - API Purity (routes.py must not init Temporal Workers)"
        run: |
          if grep -qE "\.Worker\(|Worker\(|start_worker" services/orchestrator/api/routes.py; then
            echo "🛑 BOUNDARY VIOLATION: routes.py initializes or references a Temporal Worker."
            echo "   RULE: API routes are HTTP client-only — Worker lifecycle belongs exclusively in orchestrator/main.py."
            echo "   FIX:  Remove Worker()/start_worker references. Use Temporal Client to dispatch workflows, not run Workers."
            exit 1
          else
            echo "✅ BOUNDARY CLEAR: routes.py API purity confirmed — no Worker initialization."
          fi

      # ── Guardrail 3 — Metrics Decoupling (B3: metrics.py) ───────
      - name: "Guardrail 3 - Metrics Decoupling (metrics.py must not import API layer)"
        run: |
          if grep -qE "^\s*from\s+services\.orchestrator\.api\b" orchestrator/metrics.py; then
            echo "🛑 BOUNDARY VIOLATION: metrics.py imports from services.orchestrator.api."
            echo "   RULE: The telemetry layer is a shared utility — it must not couple to the API layer."
            echo "   FIX:  Remove the services.orchestrator.api import. Pass any needed dependencies via function arguments."
            exit 1
          else
            echo "✅ BOUNDARY CLEAR: metrics.py decoupling confirmed — no API layer imports."
          fi

  build-and-test:
    needs: architectural-boundary-enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify changelog paths exist
        run: node scripts/verify-changelog-paths.js CHANGELOG.md

      - name: Repo Hygiene Guard
        run: bash scripts/repo-hygiene-guard.sh

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: |
          # Ensure base ref is available for commit range validation
          # Use the true merge-base of the PR branch against the target branch so
          # that commits already in main (brought in via "Merge branch 'main' into
          # <pr-branch>" merges) are never re-validated.  This is more reliable
          # than github.event.pull_request.base.sha when the sprint branch contains
          # merge-back commits from an older tip of main.
          npm install --no-save --ignore-scripts @commitlint/cli @commitlint/config-conventional
          MERGE_BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          echo "Linting commits from merge-base ${MERGE_BASE} to HEAD"
          npx @commitlint/cli \
            --from "${MERGE_BASE}" \
            --to HEAD \
            --verbose

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.14"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      # ─────────────────────────────────────────────────────────────
      # Turborepo Caching
      # ─────────────────────────────────────────────────────────────
      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-

      # ─────────────────────────────────────────────────────────────
      # PHASE 1: Static Analysis
      # ─────────────────────────────────────────────────────────────
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: |
          # Only validate the HEAD commit, not the full PR range.
          # Historical commits from other contributors may use non-conventional
          # formats (GitHub UI defaults, emoji prefixes, etc.) and cannot be amended.
          bunx commitlint --last --verbose

      - name: TypeScript type check
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: React singleton check
        run: bun run check:react

      - name: Verify Python availability
        run: |
          python3 --version
          which python3

      # ─────────────────────────────────────────────────────────────
      # PHASE 2: Unit Tests
      # ─────────────────────────────────────────────────────────────
      - name: Clear Vitest cache
        run: |
          # Remove any stale Vitest cache that might reference deleted test files
          rm -rf node_modules/.vitest
          echo "✅ Vitest cache cleared"

      - name: Run unit tests
        run: bun run test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          REQUIRE_SUPABASE_INTEGRATION_TESTS: "false"

      - name: Run JS coverage
        run: bun run test:coverage

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run orchestrator Python coverage
        run: cd orchestrator && pip install -r requirements.txt && pytest --cov=. --cov=../omega --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        if: vars.SONAR_CI_SCAN_ENABLED != 'false'
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────
      # PHASE 2.5: OmniEval Deterministic Evaluation
      # ─────────────────────────────────────────────────────────────
      - name: Run OmniEval (deterministic eval gate)
        run: bun run eval:ci

      - name: Upload OmniEval report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: omnieval-report
          path: artifacts/evals/report.json
          retention-days: 30

      # ─────────────────────────────────────────────────────────────
      # PHASE 3: Build
      # ─────────────────────────────────────────────────────────────
      - name: Vercel Production Sync Shield
        run: cd apps/omnihub-site && bun install --frozen-lockfile --omit=dev && bun run build

      - name: Build production bundle
        run: bun run build

      - name: Bundle size check
        run: |
          bunx size-limit --json > bundle-size.json || {
            echo "::error::Bundle size exceeds limits. Run 'bun run bundle:analyze' locally."
            cat bundle-size.json
            exit 1
          }
          echo "✅ Bundle size within limits"

      - name: Upload bundle stats
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bundle-stats
          path: |
            dist/stats.html
            bundle-size.json
          retention-days: 30

      # ─────────────────────────────────────────────────────────────
      # PHASE 4: Runtime Smoke Tests
      # ─────────────────────────────────────────────────────────────
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: |
          # CI runs chromium-only (see playwright.config.ts for rationale)
          # Firefox/WebKit require OS packages unavailable on GitHub Actions runners
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start preview server
        run: |
          bun run preview -- --host --port 4173 &
          echo $! > preview.pid
          # Wait for server to be ready
          npx wait-on http://localhost:4173 --timeout 30000

      - name: Run asset access tests
        run: bun run test:assets
        env:
          BASE_URL: http://localhost:4173

      - name: Run Playwright render tests
        run: bun run test:e2e
        env:
          BASE_URL: http://localhost:4173

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill $(cat preview.pid) || true
            rm preview.pid
          fi

      # ─────────────────────────────────────────────────────────────
      # PHASE 5: Guard Rail Violation Scan
      # ─────────────────────────────────────────────────────────────
      - name: Scan for Guard Rail Violations
        if: always()
        run: |
          mkdir -p logs
          if grep -rqE "GUARD_RAIL_VIOLATION|policy breach|tri-force violation" logs/ 2>/dev/null; then
            echo "GUARD_RAIL_VIOLATION_DETECTED=true" >> "$GITHUB_ENV"
            echo "::error::Guard rail violation detected in logs"
            exit 1
          fi
          echo "No guard rail violations detected"

      # ─────────────────────────────────────────────────────────────
      # PHASE 6: Upload Artifacts
      # ─────────────────────────────────────────────────────────────
      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # OPTIONAL: Vercel Preview URL Tests
  # Runs against deployed preview if available
  # ─────────────────────────────────────────────────────────────────
  preview-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.14"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache-preview
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: |
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Wait for Vercel Preview
        uses: patrickedqvist/wait-for-vercel-preview@d7982701e6fcd3ae073bff929e408e004404d38d # v1.3.3
        id: vercel-preview
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          check_interval: 10
          vercel_password: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        continue-on-error: true

      - name: Run asset tests against preview
        if: steps.vercel-preview.outputs.url != ''
        run: bun run test:assets
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.vercel-preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Run Playwright tests against preview
        if: steps.vercel-preview.outputs.url != ''
        run: bun run test:e2e
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.vercel-preview.outputs.url }}

      - name: Upload preview test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: preview-playwright-report
          path: playwright-report/
          retention-days: 7
