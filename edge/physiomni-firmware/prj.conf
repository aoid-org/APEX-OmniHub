# Zephyr Project Configuration for PhysiOmni Puck (nRF9161-DK)
# Targets: nrf9161dk_nrf9161_ns

# ── 1. GENERAL & C LIBRARY ───────────────────────────────────────────────────
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y

# ── 2. NETWORK & MODEM (nRF9161 TLS Offload) ──────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_HTTP_CLIENT=y

# ── 3. SENSING & DATA SERIALIZATION ──────────────────────────────────────────
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_JSON_LIBRARY=y

# ── 4. APEX CONFIGURATIONS ───────────────────────────────────────────────────
CONFIG_PHYSIOMNI_TENANT_ID="4b2f3a8b-1e7c-4c91-923f-5d02a895226c"

# ── 5. AegisKernel POWER MANAGEMENT (eDRX / PSM / PM Device) ──────────────────
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_LTE_EDRX_REQ=y
CONFIG_LTE_PSM_REQ=y
# Request active time (T3324) of 20 seconds, and periodic tracking (T3412) of 4 hours
CONFIG_LTE_LC_PSM_PARAMS="0010010000000100"
# Request eDRX cycle of 81.92 seconds
CONFIG_LTE_LC_EDRX_PARAMS="1000"
