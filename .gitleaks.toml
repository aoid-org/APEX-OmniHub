# Gitleaks configuration

# https://github.com/gitleaks/gitleaks



title = "APEX-OmniHub Gitleaks Config"



[allowlist]

description = "Exclude known synthetic fixture and template files only"

paths = [

  '''PRODUCTION_BLOCKERS_ANALYSIS\.md''',

  '''\.env\.example''',

  '''MIGRATION.*\.md''',

  '''.*\.example'''

]



# Exclude known safe patterns (Supabase public anon keys are safe to commit)

regexes = [

  '''(?i)supabase.*anon.*key''',

  '''(?i)publishable.*key''',

  '''<your-.*>'''

]
