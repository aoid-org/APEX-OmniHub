[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-orchestrator"
version = "0.1.0"
description = "AI Agent Orchestration Platform with Temporal.io, Event Sourcing, and Saga Patterns"
authors = [{name = "APEX Business Systems"}]
requires-python = ">=3.10"
dependencies = [
    # Auth
    "authlib>=1.3.0",
    # Web framework (required by main.py API server)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # Rate limiting for the API server (server.py)
    "slowapi>=0.1.9",

    # Temporal.io workflow engine
    "temporalio>=1.22.0",

    # Data validation and serialization
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Redis with vector search capabilities
    # Keep in sync with requirements.txt. redis-py 7.x rejects the ssl kwarg
    # path used by the current async from_url startup code on TLS Redis URLs.
    "redis[hiredis]>=5.0.0,<6.0.0",
    "redis-om>=0.2.0",

    # LLM interface with instructor + litellm
    "instructor>=1.0.0",
    "litellm>=1.0.0",

    # Database
    "supabase>=2.3.0",
    "asyncpg>=0.29.0",

    # Utilities
    "aiofiles>=23.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",

    # Embeddings for semantic cache
    "sentence-transformers>=2.3.0",
    "numpy>=1.26.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.4.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "black>=23.12.0",
    "httpx>=0.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "infrastructure*", "workflows*", "activities*", "observability*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
# Add repo root so tests can import top-level packages (e.g. omega.dashboard)
pythonpath = [".."]

[tool.coverage.run]
omit = [
    "server.py",
    "sandbox_test.py",
    "workflows/agent_saga.py",
    "workflows/universal_saga.py",
    "workflows/__init__.py",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "pydantic_settings.*",
    "fastapi.*",
    "starlette.*",
    "uvicorn.*",
    "supabase.*",
    "litellm.*",
    "instructor.*",
    "sentence_transformers.*",
    "numpy.*",
    "redis.*",
    "redis_om.*",
    "slowapi.*",
    "temporalio.*",
    "prometheus_client.*",
    "mysql.*",
    "aiofiles.*",
    "httpx.*",
]
ignore_missing_imports = true

# Third-party decorators/subclasses resolve to Any without stubs
[[tool.mypy.overrides]]
module = [
    "activities.*",
    "workflows.*",
    "observability.*",
    "infrastructure.cache",
    "server",
    "omniboard.*",
    "models.*",
    "security.request_signing",
    "providers.database.supabase_provider",
]
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enable stricter rules for SonarQube A-grade
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
]

ignore = [
    "S101",  # assert usage (OK in tests)
    "T201",  # print usage (OK for fallback logging)
    "UP042", # (str, Enum) instead of StrEnum (CI Python 3.11.14 compatibility)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",   # assert is expected in pytest tests
  "S110",   # try-except-pass in chaos tests is intentional
  "S311",   # pseudo-random in tests is fine (not crypto)
  "SIM117", # nested with-statements improve test readability (setup vs assertion)
  "E501",   # test strings/comments may legitimately exceed 100 chars
  "I001",   # import sort order: omega/ is a sibling package added via pythonpath
]
"workflows/**/*.py" = [
  "C901",  # Complex workflow orchestration is expected
]
"server.py" = ["S104"]  # Allow 0.0.0.0 binding for container deployment
# S608 is a false positive here: table/column names go through validate_table_name /
# validate_column_name (allowlist + pattern), and all values are asyncpg bind params.
"providers/database/postgres_provider.py" = ["S608"]

[tool.black]
line-length = 100
target-version = ["py310"]