# Prometheus scrape config for APEX Orchestrator
# Mounted into the prometheus container via docker-compose.prod.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "apex-orchestrator"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["orchestrator:8000"]
        labels:
          service: "apex-orchestrator"
          environment: "production"
