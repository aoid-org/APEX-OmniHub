[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-compress"
version = "1.0.0"
description = "Zero-dependency token optimization library for APEX-OmniHub LLM pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "UNLICENSED"}
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
apex-compress = "cli:main"
