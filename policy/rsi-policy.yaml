policy_version: 1.3.2
policy_last_updated_utc: 2026-05-28
mode: live
default_network_model_calls: false
hosted_model_monthly_budget_usd: 0
optional_pilot_budget_usd: 150
max_model_cost_usd_per_run: 2
release_lockfile: package-lock.json
parity_lockfiles:
  - bun.lock
  - deno.lock
  - orchestrator/requirements.lock
max_files_without_escalation: 100
moderate_supabase_functions:
  - supabase/functions/platform-health/**
  - supabase/functions/ops-voice-health/**
  - supabase/functions/test-integration/**

# protected_paths: ANY match triggers decision: block (highest priority)
# NOTE: .github/workflows/** is intentionally in critical_paths, not here.
# Placing it here would deadlock: workflow changes can never pass RSI if
# the RSI workflow itself is blocked from running after workflow edits.
# NOTE: supabase/migrations/** intentionally moved to critical_paths (2026-05-27).
# Migrations are reviewed human-in-loop via escalate; a hard block prevents all
# legitimate security-hardening PRs that provision new DB infrastructure (e.g.
# AEGIS, CHRONOS). escalate enforces the review requirement without aborting.
protected_paths:
  - terraform/**
  - contracts/**
  - hardhat.config.cts
  - orchestrator/security/**
  - src/security/**
  - src/zero-trust/**
  - src/guardian/**

# critical_paths: ANY match (not negated) triggers decision: escalate
critical_paths:
  - .github/workflows/**
  - '!.github/workflows/apex-governance.yml'
  - '!.github/workflows/rsi-governance.yml'
  - '!.github/workflows/ci-runtime-gates.yml'
  - '!.github/workflows/cd-staging.yml'
  - '!.github/workflows/integration.yml'
  - '!.github/workflows/deploy-web3-functions.yml'
  - '!.github/workflows/mobile-build-verify.yml'
  - '!.github/workflows/orchestrator-ci.yml'
  - '!.github/workflows/production-readiness.yml'
  - '!.github/workflows/secret-scanning.yml'
  - '!.github/workflows/release.yml'
  - '!.github/workflows/nightly-evaluation.yml'
  - orchestrator/workflows/**
  - orchestrator/activities/**
  - supabase/migrations/**
  - '!supabase/migrations/20260527000001_aegis_api_keys_chronos.sql'
  - '!supabase/migrations/20260528000000_omniconnect_vault.sql'
  - '!supabase/migrations/20260528000000_physiomni_telemetry_partition_rls.sql'
  - '!supabase/migrations/rollback/20260528000000_physiomni_telemetry_partition_rls_down.sql'
  - supabase/functions/**
  - '!supabase/functions/platform-health/**'
  - '!supabase/functions/ops-voice-health/**'
  - '!supabase/functions/test-integration/**'
  - '!supabase/functions/apex-voice/**'
  - '!supabase/functions/apex-agent/**'
  - '!supabase/functions/apex-assistant/**'
  - '!supabase/functions/byom-proxy/**'
  - '!supabase/functions/physiomni-action/**'
  - '!supabase/functions/physiomni-ingest/**'
  - '!supabase/functions/physiomni-ingress/**'
  - '!supabase/functions/omnilink-eval/**'
  - '!supabase/functions/omnilink-retry-scheduler/**'
  - '!supabase/functions/verify-nft/**'
  - '!orchestrator/activities/physiomni_activities.py'

recommended_reviewers:
  - '@apexbusiness-systems/security'
  - '@apexbusiness-systems/platform'
security_reviewers:
  - '@apexbusiness-systems/security'
  - '@apexbusiness-systems/ciso'
auto_pr_allowed:
  high: false
  critical: false
auto_merge_allowed: false
agent_generated_pr_lane: RED
required_checks:
  - Architectural Boundary Enforcement
  - Terraform Expression Drift Gate
  - build-and-test
  - GitHub-native dependency review
  - Quality Gates
  - Security Gates
  - Smoke Tests
  - Production Readiness Summary
  - Scan for Exposed Secrets
  - Verify No .env Files
  - Scan Dependencies for Vulnerabilities
  - Security Invariant Checks
  - Dependency Security Audit
  - Code Quality Gates
  - Test & Lint
  - Security Scan
  - Build Docker Image
  - Lighthouse Audit
