version: '3.9'

services:
  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEMPORAL_DB_USER:?TEMPORAL_DB_USER required}
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD required}
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }

  temporal:
    image: temporalio/auto-setup:1.24.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_DB_USER:?TEMPORAL_DB_USER required}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD required}
      POSTGRES_SEEDS: postgres
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - temporal_data:/etc/temporal
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

  orchestrator:
    build:
      context: ./orchestrator
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: apex-orchestrator
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: INFO
      ENVIRONMENT: production
      SUPABASE_URL_FILE: /run/secrets/supabase_url
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      SUPABASE_DB_URL_FILE: /run/secrets/supabase_db_url
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    secrets:
      - supabase_url
      - supabase_service_role_key
      - supabase_db_url
      - openai_api_key
      - anthropic_api_key
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }


  orchestrator-worker-default:
    build:
      context: ./orchestrator
    restart: unless-stopped
    command: ["python", "main.py", "worker"]
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: default
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: production
      SUPABASE_URL_FILE: /run/secrets/supabase_url
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      SUPABASE_DB_URL_FILE: /run/secrets/supabase_db_url
    secrets:
      - supabase_url
      - supabase_service_role_key
      - supabase_db_url

  orchestrator-worker-io:
    build:
      context: ./orchestrator
    restart: unless-stopped
    command: ["python", "main.py", "worker"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: io
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: production
      SUPABASE_URL_FILE: /run/secrets/supabase_url
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      SUPABASE_DB_URL_FILE: /run/secrets/supabase_db_url
    secrets:
      - supabase_url
      - supabase_service_role_key
      - supabase_db_url

  orchestrator-worker-llm:
    build:
      context: ./orchestrator
    restart: unless-stopped
    command: ["python", "main.py", "worker"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: llm
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: production
      SUPABASE_URL_FILE: /run/secrets/supabase_url
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      SUPABASE_DB_URL_FILE: /run/secrets/supabase_db_url
    secrets:
      - supabase_url
      - supabase_service_role_key
      - supabase_db_url

volumes:
  temporal_postgres_data:
  temporal_data:
  redis_data:


secrets:
  supabase_url:
    file: ./ops/secrets/supabase_url.txt
  supabase_service_role_key:
    file: ./ops/secrets/supabase_service_role_key.txt
  supabase_db_url:
    file: ./ops/secrets/supabase_db_url.txt
  openai_api_key:
    file: ./ops/secrets/openai_api_key.txt
  anthropic_api_key:
    file: ./ops/secrets/anthropic_api_key.txt
