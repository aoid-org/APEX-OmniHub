# Gitleaks security rules for APEX-OmniHub
# Extended with guardrail violation detection

title = "APEX-OmniHub Security Rules"

# ── Custom Rules ─────────────────────────────────────────────────────

[[rules]]
id = "guard-rail-violation"
description = "Detect GUARD_RAIL_VIOLATION markers committed to source"
regex = '''GUARD_RAIL_VIOLATION'''
tags = ["security", "guardrail"]

[[rules]]
id = "policy-breach-marker"
description = "Detect policy breach markers committed to source"
regex = '''policy[_\s]*breach'''
tags = ["security", "guardrail"]

# ── Allowlist ────────────────────────────────────────────────────────

[allowlist]
description = "Files allowed to reference violation patterns"
paths = [
  '''tests/.*''',
  '''docs/.*''',
  '''.*\.md''',
  '''\.github/workflows/.*''',
  '''security/\.gitleaks\.toml''',
]
