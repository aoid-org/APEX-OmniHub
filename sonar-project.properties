# SonarQube duplication tuning
# These SQL migrations intentionally mirror schemas across runtime contexts
# (sim/local vs supabase) and trigger false-positive CPD failures.
sonar.cpd.exclusions=sim/migrations/001_create_idempotency_receipts.sql,supabase/migrations/20260215000000_create_idempotency_receipts.sql,supabase/migrations/20251221000000_omnilink_agentic_rag.sql,supabase/migrations/20251221000001_omnilink_ops_pack.sql

# Security Hotspot Exclusions
# e1: Allow clear-text HTTP protocols in tests (e.g. http://localhost)
# e2: Allow hardcoded IPs in the SSRF protection logic itself (the blocklist)
# e3: Allow hardcoded IPs in tests (test vectors for blocked IPs)
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.e2.resourceKey=**/ssrf-protection.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*_test.ts
