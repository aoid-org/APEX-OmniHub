# TruffleHog v3 Configuration
# See: https://github.com/trufflesecurity/trufflehog

# Exclude paths with documentation and example files
exclude_paths:
  - "**/PRODUCTION_BLOCKERS_ANALYSIS.md"
  - "**/*.example"
  - "**/docs/**"
  - "**/examples/**"
  - "**/.env.example"
  - "**/MIGRATION_*.md"
  - "**/node_modules/**"
  - "**/.git/**"

# Detector configuration
# Only enable verification for detectors that support it
detectors:
  - name: jwt
    verify: true

# Note: Supabase anon keys are public by design (client-side auth).
# TruffleHog will flag them as potential secrets. This is expected.
# CI uses --only-verified flag to only fail on confirmed live credentials.
