  <text x="324" y="427" class="small">bridge/acl.ts, translation/,</text>
  <text x="324" y="447" class="small">ingress/, policy/, delivery/</text>

  <rect x="550" y="378" width="220" height="110" rx="12" ry="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="564" y="405" class="t">Integration Adapters</text>
  <text x="564" y="427" class="small">integrations/omnilink,</text>
  <text x="564" y="447" class="small">omniport, supabase, maestro</text>

  <rect x="70" y="510" width="220" height="110" rx="12" ry="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="84" y="537" class="t">Security &amp; Identity</text>
  <text x="84" y="559" class="small">security/, zero-trust/,</text>
  <text x="84" y="579" class="small">guardian/, lib/web3/</text>

  <rect x="310" y="510" width="220" height="110" rx="12" ry="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="324" y="537" class="t">Core Platform</text>
  <text x="324" y="559" class="small">core/mcp/ (MCPHostManager),</text>
  <text x="324" y="579" class="small">stores/, armageddon/, utils/</text>

  <rect x="550" y="510" width="220" height="110" rx="12" ry="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="564" y="537" class="t">Shared Libraries</text>
  <text x="564" y="559" class="small">lib/database, lib/storage,</text>
  <text x="564" y="579" class="small">lib/realtime, lib/extensibility</text>

  <!-- Test + config -->
  <rect class="box" x="860" y="490" width="700" height="160" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="880" y="522" class="h">Quality &amp; Tooling Layer</text>
  <text x="880" y="548" class="small">vitest.config.ts → unit/integration/sim/apex-resilience test selection</text>
  <text x="880" y="570" class="small">playwright.config.ts → e2e runtime smoke + preview server startup</text>
  <text x="880" y="592" class="small">eslint.config.js + tsconfig* + package.json scripts drive CI gates</text>
  <text x="880" y="614" class="small">tests/ folders: components, integration, omniconnect, omnidash, security, web3, stress</text>

  <!-- ══ NEW: apps/omnihub-site Bridge FSM Plane (Plane Isolation) ══ -->
  <rect class="box" x="40" y="700" width="820" height="250" fill="#fdf4ff" stroke="#a21caf"/>
  <text x="60" y="732" class="h">apps/omnihub-site — Bridge FSM Plane (Isolated, No src/ Imports)</text>
  <text x="60" y="756" class="small">Supabase Realtime WebSocket → isBridgePayload() guard → BridgeFSM render → DashboardOverview</text>

  <rect x="70" y="775" width="230" height="150" rx="12" ry="12" fill="#fae8ff" stroke="#c026d3" stroke-width="1.5"/>
  <text x="84" y="802" class="t">bridge-types.ts</text>
  <text x="84" y="824" class="small">• BridgePayload interface</text>
  <text x="84" y="844" class="small">• MANModeCredential types</text>
  <text x="84" y="864" class="small">• isBridgePayload() type guard</text>
  <text x="84" y="884" class="small">• 5-action FSM contract</text>
  <text x="84" y="904" class="small">(Self-contained, no Zustand)</text>

  <rect x="320" y="775" width="230" height="150" rx="12" ry="12" fill="#fae8ff" stroke="#c026d3" stroke-width="1.5"/>
  <text x="334" y="802" class="t">useBridgeState.ts</text>
  <text x="334" y="824" class="small">• Supabase channel subscribe</text>
  <text x="334" y="844" class="small">• isBridgePayload() on event</text>
  <text x="334" y="864" class="small">• MAN Mode fail-closed dismiss</text>
  <text x="334" y="884" class="small">• MULTISIG_CODE_RE ^\d{6}$</text>
  <text x="334" y="904" class="small">• Returns BridgeState</text>

  <rect x="570" y="775" width="270" height="150" rx="12" ry="12" fill="#fae8ff" stroke="#c026d3" stroke-width="1.5"/>
  <text x="584" y="802" class="t">BridgeFSM.tsx + DashboardOverview</text>
  <text x="584" y="824" class="small">• Renders: PENDING_NETWORK → Spinner</text>
  <text x="584" y="844" class="small">• Renders: PROCESSING → Progress</text>
  <text x="584" y="864" class="small">• Renders: SETTLED → CheckCircle</text>
  <text x="584" y="884" class="small">• Renders: RECONCILED → Delta $0.00</text>
  <text x="584" y="904" class="small">• MAN_MODE_LOCKDOWN → MANModeModal</text>

  <!-- ══ NEW: Semantic Bridge + Financial Automation ══ -->
  <rect class="box" x="880" y="700" width="680" height="250" fill="#fff7ed" stroke="#c2410c"/>
  <text x="900" y="732" class="h">Semantic Bridge + Financial Automation Layer</text>
  <text x="900" y="756" class="small">Zero-Trust financial tables + Temporal compensation + JWT claim enforcement</text>

  <rect x="900" y="770" width="300" height="155" rx="12" ry="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="914" y="797" class="t">OmniConnect bridge/acl.ts</text>
  <text x="914" y="819" class="small">• BridgePayloadSchema (Zod)</text>
  <text x="914" y="839" class="small">• BridgeParseError + correlationId</text>
  <text x="914" y="859" class="small">• validateBridgePayload()</text>
  <text x="914" y="879" class="small">• tryParseBridgePayload()</text>
  <text x="914" y="899" class="small">• Anchored ISO/TX/amount regex</text>
  <text x="914" y="919" class="small">• SemanticTranslator Web3+ERP</text>

  <rect x="1220" y="770" width="310" height="155" rx="12" ry="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1234" y="797" class="t">Orchestrator + Migration 52</text>
  <text x="1234" y="819" class="small">• compensate_web3_tx.py activity</text>
  <text x="1234" y="839" class="small">• saga_jwt_validator.py (SagaAuthError)</text>
  <text x="1234" y="859" class="small">• invoices table (RLS + tenant_id)</text>
  <text x="1234" y="879" class="small">• compliance_records table (RLS)</text>
  <text x="1234" y="899" class="small">• apex_jwt_tenant_id() IMMUTABLE</text>
  <text x="1234" y="919" class="small">• MCPHostManager.requireFinancialApproval</text>

  <!-- ══ Docs ══ -->
  <rect class="box" x="40" y="990" width="1520" height="220" fill="#ecfeff" stroke="#0e7490"/>
